name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Run Linter
      run: npm run lint

    - name: Run Test Suite
      run: npm run test

    - name: Build Application
      run: npm run build
      env:
        # Provide mock/empty env values required during compilation
        MONGODB_URI: "mongodb://localhost:27017/test"
        NEXTAUTH_SECRET: "mock-secret-for-ci-building-purposes-only"
        NEXTAUTH_URL: "http://localhost:3000"
        FIREBASE_PROJECT_ID: "mock-project-id"
        FIREBASE_CLIENT_EMAIL: "mock-email"
        FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMOCK\n-----END PRIVATE KEY-----\n"
        NEXT_PUBLIC_FIREBASE_API_KEY: "mock"
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "mock"
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: "mock"
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "mock"
        NEXT_PUBLIC_FIREBASE_APP_ID: "mock"
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: "mock"
